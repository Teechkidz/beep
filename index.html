<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEEP! Math Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #1a0a3e;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Flash overlay on BEEP ── */
    #flash {
      position: fixed;
      inset: 0;
      background: rgba(255,80,80,0.22);
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.05s;
    }
    #flash.on { opacity: 1; }

    /* ════════════════════════════
       SETUP SCREEN
    ════════════════════════════ */
    #setup-screen {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px 40px;
      overflow-y: auto;
    }

    #setup-card {
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 700px;
      padding: 32px 28px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .setup-header { text-align: center; }

    .setup-header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 3.2rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.08em;
      text-shadow: 0 0 30px rgba(220,60,60,0.7);
    }

    .setup-header p {
      color: rgba(255,255,255,0.55);
      font-size: 1rem;
      font-weight: 700;
      margin-top: 4px;
    }

    /* Sequence rows */
    #seq-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 52vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    #seq-list::-webkit-scrollbar { width: 6px; }
    #seq-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
    #seq-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

    .seq-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 12px;
      animation: rowIn 0.18s ease;
    }

    @keyframes rowIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .seq-num {
      color: rgba(255,255,255,0.35);
      font-size: 0.85rem;
      font-weight: 700;
      min-width: 22px;
      text-align: right;
    }

    .seq-input {
      flex: 1;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      padding: 7px 12px;
      outline: none;
      transition: border-color 0.2s;
      min-width: 0;
    }
    .seq-input:focus { border-color: rgba(255,255,255,0.55); }
    .seq-input::placeholder { opacity: 0.35; font-weight: 700; }

    .arrow-label {
      color: rgba(255,255,255,0.3);
      font-size: 1.1rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    .ans-input {
      width: 80px;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }
    .ans-input:focus { border-color: rgba(255,255,255,0.55); }
    .ans-input::placeholder { opacity: 0.35; }

    .ans-hint {
      font-size: 0.78rem;
      color: rgba(120,255,160,0.7);
      font-weight: 700;
      min-width: 36px;
      text-align: left;
    }

    .del-btn {
      background: rgba(255,80,80,0.15);
      border: 1px solid rgba(255,80,80,0.3);
      border-radius: 7px;
      color: rgba(255,120,120,0.8);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 5px 9px;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .del-btn:hover { background: rgba(255,80,80,0.3); color: #fff; }

    /* Setup buttons */
    .setup-btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    #add-btn {
      background: rgba(255,255,255,0.1);
      border: 2px dashed rgba(255,255,255,0.25);
      border-radius: 12px;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 20px;
      transition: background 0.15s, border-color 0.15s;
      flex: 1;
    }
    #add-btn:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.45); color: #fff; }

    #start-btn {
      background: linear-gradient(135deg, #e02020, #900000);
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(200,0,0,0.45);
      color: #fff;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      padding: 12px 32px;
      transition: filter 0.12s, transform 0.1s;
      flex: 2;
    }
    #start-btn:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); }
    #start-btn:active:not(:disabled) { transform: translateY(1px); }
    #start-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .setup-note {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
      text-align: center;
    }

    /* ════════════════════════════
       GAME SCREEN
    ════════════════════════════ */
    #game-screen {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 20px;
    }

    /* Top bar */
    #game-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      z-index: 20;
    }

    #edit-btn {
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.18);
      border-radius: 9px;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 6px 14px;
      transition: background 0.15s;
    }
    #edit-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }

    #progress-label {
      color: rgba(255,255,255,0.6);
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    #progress-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transition: background 0.2s;
    }
    .dot.done  { background: rgba(120,255,160,0.7); }
    .dot.curr  { background: #fff; transform: scale(1.3); }

    /* BEEP button */
    #beep-btn {
      background: linear-gradient(160deg, #e82020 0%, #a00000 100%);
      border: none;
      border-radius: 24px;
      box-shadow: 0 8px 36px rgba(220,0,0,0.55), 0 2px 8px rgba(0,0,0,0.4);
      color: #fff;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 0.09em;
      padding: 28px 88px;
      transition: transform 0.08s, box-shadow 0.08s, filter 0.08s;
      user-select: none;
      min-width: 340px;
      text-align: center;
    }
    #beep-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 14px 44px rgba(220,0,0,0.65), 0 4px 12px rgba(0,0,0,0.4);
    }
    #beep-btn:active { transform: scale(0.95) translateY(2px); filter: brightness(0.92); }

    #beep-btn.blast {
      animation: blast 0.4s ease;
    }
    @keyframes blast {
      0%   { transform: scale(0.94) translateY(3px); }
      15%  { transform: scale(1.07) rotate(-2deg); }
      30%  { transform: scale(1.07) rotate(2deg); }
      50%  { transform: scale(1.03) rotate(-1deg); }
      70%  { transform: scale(1.03) rotate(1deg); }
      100% { transform: scale(1) rotate(0); }
    }

    /* Number display */
    #number-display {
      background: #fff;
      border-radius: 20px;
      width: 100%;
      max-width: 820px;
      min-height: 150px;
      padding: 28px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px 16px;
      box-shadow: 0 8px 34px rgba(0,0,0,0.35);
    }

    .num-item {
      font-family: 'Caveat', cursive;
      font-size: 5.2rem;
      color: #d42020;
      line-height: 1;
    }

    .num-sep {
      font-family: 'Caveat', cursive;
      font-size: 4.2rem;
      color: #d42020;
      opacity: 0.55;
      line-height: 1;
      align-self: flex-end;
      padding-bottom: 4px;
    }

    .num-blank {
      font-family: 'Caveat', cursive;
      font-size: 5.2rem;
      color: #d42020;
      line-height: 1;
      min-width: 90px;
      border-bottom: 6px solid #d42020;
      text-align: center;
    }

    #display-placeholder {
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #bbb;
    }

    /* Action row */
    #action-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 820px;
    }

    .nav-btn {
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.22);
      border-radius: 12px;
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 900;
      padding: 11px 22px;
      transition: background 0.15s, transform 0.1s;
    }
    .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.22); color: #fff; transform: translateY(-1px); }
    .nav-btn:active:not(:disabled) { transform: translateY(1px); }
    .nav-btn:disabled { opacity: 0.28; cursor: not-allowed; }

    #reveal-btn {
      flex: 1;
      background: linear-gradient(135deg, #27ae60, #1a7a45);
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      padding: 12px 28px;
      box-shadow: 0 4px 16px rgba(0,150,80,0.4);
      transition: filter 0.12s, transform 0.1s, opacity 0.2s;
      max-width: 260px;
    }
    #reveal-btn:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
    #reveal-btn:active:not(:disabled) { transform: translateY(1px); }
    #reveal-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    #next-btn.highlight {
      background: linear-gradient(135deg, #f39c12, #d67c00);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 20px rgba(240,150,0,0.5);
      animation: pulse 0.9s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { box-shadow: 0 4px 20px rgba(240,150,0,0.4); }
      to   { box-shadow: 0 6px 28px rgba(240,150,0,0.75); transform: translateY(-2px); }
    }

    /* Status text */
    #status {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-align: center;
    }

    /* Reveal pop-in */
    @keyframes popIn {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.2); }
      100% { transform: scale(1);   opacity: 1; }
    }
    .pop { animation: popIn 0.32s cubic-bezier(.34,1.56,.64,1) forwards; }

    /* Done screen */
    #done-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      text-align: center;
    }
    #done-screen h2 {
      font-size: 2.6rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 28px rgba(80,200,120,0.6);
    }
    #done-screen p { color: rgba(255,255,255,0.6); font-size: 1rem; font-weight: 700; }
    #restart-btn {
      background: linear-gradient(135deg, #e02020, #900000);
      border: none;
      border-radius: 14px;
      color: #fff;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      padding: 14px 40px;
      box-shadow: 0 4px 20px rgba(200,0,0,0.4);
      transition: filter 0.12s, transform 0.1s;
    }
    #restart-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }

    /* Responsive */
    @media (max-width: 580px) {
      #beep-btn { font-size: 2.8rem; padding: 22px 50px; min-width: 240px; }
      .num-item, .num-blank { font-size: 3.8rem; }
      .num-sep { font-size: 3rem; }
      #setup-card { padding: 22px 14px; }
    }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="flash"></div>

<!-- ══════════ SETUP SCREEN ══════════ -->
<div id="setup-screen">
  <div id="setup-card">
    <div class="setup-header">
      <h1>BEEP!</h1>
      <p>Enter your sequences — then start the game</p>
    </div>

    <div id="seq-list"></div>

    <div class="setup-btn-row">
      <button id="add-btn">+ Add Sequence</button>
      <button id="start-btn" disabled>Start Game ▶</button>
    </div>

    <p class="setup-note">
      Leave "Answer" blank to auto-detect arithmetic patterns &nbsp;·&nbsp; Press Enter to add a row
    </p>
  </div>
</div>

<!-- ══════════ GAME SCREEN ══════════ -->
<div id="game-screen">

  <div id="game-topbar">
    <button id="edit-btn">← Edit</button>
    <div id="progress-dots"></div>
    <span id="progress-label">1 / 1</span>
  </div>

  <button id="beep-btn">BEEP!</button>

  <div id="number-display">
    <span id="display-placeholder">Ready!</span>
  </div>

  <div id="action-row">
    <button class="nav-btn" id="prev-btn" disabled>◀ Prev</button>
    <button id="reveal-btn" disabled>Reveal Answer</button>
    <button class="nav-btn" id="next-btn" disabled>Next ▶</button>
  </div>

  <div id="status">Hit BEEP! or press Space</div>

  <!-- Done overlay (inside game screen) -->
  <div id="done-screen">
    <h2>🎉 All Done!</h2>
    <p>You went through all <span id="done-count"></span> sequences.</p>
    <button id="restart-btn">Play Again ▶</button>
  </div>

</div>

<script>
/* ══════════════════════════════════════════
   ANIMATED BACKGROUND
══════════════════════════════════════════ */
(function () {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, t = 0;
  const waves = [
    { color:'rgba(80,60,220,0.55)',  amp:60, freq:0.008, speed:0.012, yBase:0.28, thick:4 },
    { color:'rgba(200,40,180,0.50)', amp:50, freq:0.010, speed:0.016, yBase:0.44, thick:3.5 },
    { color:'rgba(40,120,220,0.55)', amp:70, freq:0.007, speed:0.009, yBase:0.60, thick:4 },
    { color:'rgba(220,60,130,0.40)', amp:45, freq:0.012, speed:0.020, yBase:0.75, thick:3 },
    { color:'rgba(100,60,240,0.40)', amp:55, freq:0.009, speed:0.014, yBase:0.52, thick:3 },
  ];
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    waves.forEach((wave, i) => {
      ctx.beginPath();
      const yBase = h * wave.yBase;
      for (let x = 0; x <= w; x++) {
        const y = yBase + Math.sin(x * wave.freq + t * wave.speed + i * 1.3) * wave.amp;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = wave.color;
      ctx.lineWidth = wave.thick;
      ctx.stroke();
    });
    t++;
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize(); draw();
})();

/* ══════════════════════════════════════════
   BUZZER SOUND — basketball horn + buzzer
══════════════════════════════════════════ */
function playBuzzer() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const dur = 0.9;

    // Dynamics compressor → max perceived loudness without clipping
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-3, now);
    comp.knee.setValueAtTime(2, now);
    comp.ratio.setValueAtTime(20, now);
    comp.attack.setValueAtTime(0.001, now);
    comp.release.setValueAtTime(0.05, now);
    comp.connect(ctx.destination);

    // Waveshaper: tanh soft-clip → harsh buzzy distortion
    const shaper = ctx.createWaveShaper();
    const N = 512, curve = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const x = (i * 2) / N - 1;
      curve[i] = Math.tanh(x * 5);
    }
    shaper.curve = curve;
    shaper.oversample = '4x';

    // Master gain with punch envelope
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(3.0, now + 0.018); // sharp attack
    master.gain.setValueAtTime(3.0, now + dur - 0.12);
    master.gain.exponentialRampToValueAtTime(0.001, now + dur);

    shaper.connect(master);
    master.connect(comp);

    // Oscillator bank — fundamental ~200Hz (horn-like) + harmonics + slight detuning
    const base = 200;
    const oscDefs = [
      { mult: 1.00, vol: 1.0,  type: 'sawtooth' },
      { mult: 2.00, vol: 0.65, type: 'sawtooth' },
      { mult: 3.00, vol: 0.40, type: 'sawtooth' },
      { mult: 4.00, vol: 0.28, type: 'square'   },
      { mult: 1.01, vol: 0.35, type: 'sawtooth' }, // detuned unison → beating / roughness
      { mult: 0.99, vol: 0.30, type: 'sawtooth' },
      { mult: 6.00, vol: 0.12, type: 'square'   }, // high harmonic buzz
    ];

    oscDefs.forEach(({ mult, vol, type }) => {
      const osc = ctx.createOscillator();
      osc.type = type;
      // Pitch ramp up: air-horn "spin-up" feel
      osc.frequency.setValueAtTime(base * mult * 0.55, now);
      osc.frequency.exponentialRampToValueAtTime(base * mult, now + 0.04);

      const g = ctx.createGain();
      g.gain.value = vol;
      osc.connect(g);
      g.connect(shaper);
      osc.start(now);
      osc.stop(now + dur + 0.05);
    });

    // Noise burst at the very start (air blast / transient)
    const bufLen = Math.ceil(ctx.sampleRate * 0.08);
    const noiseBuf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) nd[i] = Math.random() * 2 - 1;

    const noiseNode = ctx.createBufferSource();
    noiseNode.buffer = noiseBuf;

    const noiseFilt = ctx.createBiquadFilter();
    noiseFilt.type = 'bandpass';
    noiseFilt.frequency.value = 900;
    noiseFilt.Q.value = 1.5;

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.6, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

    noiseNode.connect(noiseFilt);
    noiseFilt.connect(noiseGain);
    noiseGain.connect(master);
    noiseNode.start(now);

  } catch (e) { /* silent fail */ }
}

/* ══════════════════════════════════════════
   PATTERN DETECTION
══════════════════════════════════════════ */
function detectNext(nums) {
  if (nums.length < 2) return null;
  const diff = nums[1] - nums[0];
  for (let i = 2; i < nums.length; i++) {
    if (Math.abs((nums[i] - nums[i - 1]) - diff) > 0.0001) return null;
  }
  return Math.round((nums[nums.length - 1] + diff) * 100000) / 100000;
}

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let sequences = []; // [{nums:[], answer:number|null}]
let gameIdx   = 0;
let gamePhase = 'ready'; // 'ready' | 'revealed'

/* ══════════════════════════════════════════
   SETUP SCREEN
══════════════════════════════════════════ */
const seqListEl  = document.getElementById('seq-list');
const addBtn     = document.getElementById('add-btn');
const startBtn   = document.getElementById('start-btn');

let rowCount = 0;

function addRow(seqVal = '', ansVal = '') {
  rowCount++;
  const idx = rowCount;

  const row = document.createElement('div');
  row.className = 'seq-row';
  row.dataset.id = idx;

  row.innerHTML = `
    <span class="seq-num">${seqListEl.children.length + 1}.</span>
    <input class="seq-input" type="text" placeholder="e.g.  5, 10, 15  or  100, 90, 80" value="${seqVal}" />
    <span class="arrow-label">→</span>
    <input class="ans-input" type="number" placeholder="auto" value="${ansVal}" />
    <span class="ans-hint"></span>
    <button class="del-btn" title="Remove">✕</button>
  `;

  const seqInput = row.querySelector('.seq-input');
  const ansInput = row.querySelector('.ans-input');
  const hint     = row.querySelector('.ans-hint');

  function updateHint() {
    const parts = seqInput.value.trim().split(/[\s,]+/).filter(Boolean).map(Number);
    if (parts.length >= 2 && !parts.some(isNaN)) {
      const det = detectNext(parts);
      if (ansInput.value.trim() === '') {
        hint.textContent = det !== null ? `✓ ${det}` : '?';
        hint.style.color = det !== null ? 'rgba(120,255,160,0.8)' : 'rgba(255,180,80,0.8)';
      } else {
        hint.textContent = '';
      }
    } else {
      hint.textContent = '';
    }
    updateStartBtn();
  }

  seqInput.addEventListener('input', updateHint);
  ansInput.addEventListener('input', updateHint);

  seqInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addRow(); }
  });

  row.querySelector('.del-btn').addEventListener('click', () => {
    row.remove();
    renumberRows();
    updateStartBtn();
  });

  seqListEl.appendChild(row);
  renumberRows();
  seqInput.focus();
  if (seqVal) updateHint();
  updateStartBtn();
  return row;
}

function renumberRows() {
  Array.from(seqListEl.children).forEach((r, i) => {
    r.querySelector('.seq-num').textContent = (i + 1) + '.';
  });
}

function updateStartBtn() {
  const hasAny = seqListEl.children.length > 0 &&
    Array.from(seqListEl.querySelectorAll('.seq-input')).some(inp => inp.value.trim() !== '');
  startBtn.disabled = !hasAny;
}

function parseSetup() {
  const result = [];
  Array.from(seqListEl.querySelectorAll('.seq-row')).forEach(row => {
    const seqRaw = row.querySelector('.seq-input').value.trim();
    const ansRaw = row.querySelector('.ans-input').value.trim();
    if (!seqRaw) return;
    const nums = seqRaw.split(/[\s,]+/).filter(Boolean).map(Number);
    if (nums.some(isNaN)) return;
    const answer = ansRaw !== '' ? Number(ansRaw) : detectNext(nums);
    result.push({ nums, answer });
  });
  return result;
}

addBtn.addEventListener('click', () => addRow());

startBtn.addEventListener('click', () => {
  const parsed = parseSetup();
  if (parsed.length === 0) return;
  sequences = parsed;
  gameIdx   = 0;
  gamePhase = 'ready';
  showGameScreen();
});

// Start with 4 empty rows
for (let i = 0; i < 4; i++) addRow();

/* ══════════════════════════════════════════
   SCREEN SWITCHING
══════════════════════════════════════════ */
const setupScreen = document.getElementById('setup-screen');
const gameScreen  = document.getElementById('game-screen');
const doneScreen  = document.getElementById('done-screen');

function showSetupScreen() {
  setupScreen.style.display = 'flex';
  gameScreen.style.display  = 'none';
}

function showGameScreen() {
  setupScreen.style.display = 'none';
  gameScreen.style.display  = 'flex';
  doneScreen.style.display  = 'none';
  renderGame();
}

/* ══════════════════════════════════════════
   GAME SCREEN
══════════════════════════════════════════ */
const beepBtn      = document.getElementById('beep-btn');
const numDisplay   = document.getElementById('number-display');
const revealBtn    = document.getElementById('reveal-btn');
const prevBtn      = document.getElementById('prev-btn');
const nextBtn      = document.getElementById('next-btn');
const statusEl     = document.getElementById('status');
const progressLbl  = document.getElementById('progress-label');
const progressDots = document.getElementById('progress-dots');
const editBtn      = document.getElementById('edit-btn');
const doneCount    = document.getElementById('done-count');
const restartBtn   = document.getElementById('restart-btn');
const flashEl      = document.getElementById('flash');

function renderProgress() {
  progressLbl.textContent = `${gameIdx + 1} / ${sequences.length}`;

  // dots (max 12 shown)
  progressDots.innerHTML = '';
  const max = Math.min(sequences.length, 12);
  for (let i = 0; i < max; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < gameIdx ? ' done' : i === gameIdx ? ' curr' : '');
    progressDots.appendChild(d);
  }
}

function renderNumberDisplay(revealed) {
  numDisplay.innerHTML = '';
  const seq = sequences[gameIdx];
  if (!seq) return;

  seq.nums.forEach(n => {
    const span = document.createElement('span');
    span.className = 'num-item';
    span.textContent = n;
    numDisplay.appendChild(span);

    const sep = document.createElement('span');
    sep.className = 'num-sep';
    sep.textContent = ',';
    numDisplay.appendChild(sep);
  });

  const blank = document.createElement('span');
  blank.className = 'num-blank';
  blank.id = 'answer-slot';
  if (revealed) {
    const ans = seq.answer;
    blank.textContent = ans !== null ? ans : '?';
  } else {
    blank.textContent = '\u00A0\u00A0\u00A0\u00A0';
  }
  numDisplay.appendChild(blank);
}

function renderGame() {
  if (gameIdx >= sequences.length) {
    showDone();
    return;
  }

  gamePhase = 'ready';
  renderProgress();
  renderNumberDisplay(false);

  revealBtn.disabled = false;
  nextBtn.disabled   = false;
  prevBtn.disabled   = gameIdx === 0;
  nextBtn.classList.remove('highlight');
  statusEl.textContent = 'Hit BEEP! — then students say the next number';
}

function showDone() {
  doneScreen.style.display  = 'flex';
  beepBtn.style.display     = 'none';
  numDisplay.style.display  = 'none';
  document.getElementById('action-row').style.display = 'none';
  statusEl.textContent = '';
  doneCount.textContent = sequences.length;
}

/* BEEP */
beepBtn.addEventListener('click', () => {
  playBuzzer();

  // Button shake
  beepBtn.classList.remove('blast');
  void beepBtn.offsetWidth;
  beepBtn.classList.add('blast');
  beepBtn.addEventListener('animationend', () => beepBtn.classList.remove('blast'), { once: true });

  // Screen flash
  flashEl.classList.add('on');
  setTimeout(() => flashEl.classList.remove('on'), 110);

  statusEl.textContent = 'What comes next?';
});

/* Reveal */
revealBtn.addEventListener('click', () => {
  if (gamePhase === 'revealed') return;
  gamePhase = 'revealed';
  renderNumberDisplay(true);
  revealBtn.disabled = true;

  const slot = document.getElementById('answer-slot');
  if (slot) slot.classList.add('pop');

  const ans = sequences[gameIdx]?.answer;
  statusEl.textContent = ans !== null ? `The answer is ${ans}!` : 'Answer revealed!';

  // Highlight Next button
  if (gameIdx < sequences.length - 1) {
    nextBtn.classList.add('highlight');
  }
});

/* Next */
nextBtn.addEventListener('click', () => {
  if (gameIdx >= sequences.length - 1) { showDone(); return; }
  gameIdx++;
  renderGame();
});

/* Prev */
prevBtn.addEventListener('click', () => {
  if (gameIdx === 0) return;
  gameIdx--;
  renderGame();
});

/* Edit */
editBtn.addEventListener('click', () => {
  beepBtn.style.display     = '';
  numDisplay.style.display  = '';
  document.getElementById('action-row').style.display = '';
  doneScreen.style.display  = 'none';
  showSetupScreen();
});

/* Restart */
restartBtn.addEventListener('click', () => {
  beepBtn.style.display     = '';
  numDisplay.style.display  = '';
  document.getElementById('action-row').style.display = '';
  doneScreen.style.display  = 'none';
  gameIdx   = 0;
  gamePhase = 'ready';
  showGameScreen();
});

/* Keyboard */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (gameScreen.style.display === 'none') return;
  if (e.code === 'Space') { e.preventDefault(); beepBtn.click(); }
  if (e.code === 'Enter' || e.code === 'KeyR') { e.preventDefault(); if (!revealBtn.disabled) revealBtn.click(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); if (!nextBtn.disabled) nextBtn.click(); }
  if (e.code === 'ArrowLeft')  { e.preventDefault(); if (!prevBtn.disabled) prevBtn.click(); }
});
</script>
</body>
</html>
